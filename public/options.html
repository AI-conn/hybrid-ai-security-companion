<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Google Sans', system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; max-width: 600px; margin: 0 auto; }
    h1 { color: #58a6ff; font-size: 20px; margin-bottom: 16px; }
    .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input, textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #e6edf3; padding: 8px; margin-bottom: 8px; }
    button { background: #238636; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .status { padding: 8px; border-radius: 4px; margin-top: 8px; }
    .ok { background: #1a4721; color: #4ade80; }
    .err { background: #3a0f0e; color: #f85149; }
  </style>
</head>
<body>
  <h1>Settings</h1>

  <div class="section">
    <h2>Firebase AI Logic</h2>
    <p>Configured via <code>firebase-config.json</code>. Project: hybrid-ai-security-companion</p>
    <div id="fb-status" class="status">Checking...</div>
  </div>

  <div class="section">
    <h2>On-Device Model</h2>
    <p>Gemini Nano 4 via Chrome's built-in Prompt API. Falls back to cloud when unavailable.</p>
    <div id="model-status" class="status">Checking...</div>
  </div>

  <div class="section">
    <h2>Custom System Prompt</h2>
    <textarea id="system-prompt" rows="4" placeholder="Override the default system prompt...">You are a senior security researcher helping with bug bounty hunting. Be concise and technical. No hedging.</textarea>
    <button onclick="savePrompt()">Save</button>
  </div>

  <script type="module" src="../src/options.js"></script>
</body>
</html>
