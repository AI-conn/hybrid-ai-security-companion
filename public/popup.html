<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; font-family: 'Google Sans', system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 16px; }
    h1 { font-size: 18px; color: #58a6ff; margin-bottom: 4px; }
    .mode { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
    .mode .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .mode .on-device { background: #1a4721; color: #4ade80; }
    .mode .cloud { background: #1a2332; color: #58a6ff; }
    textarea { width: 100%; height: 100px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 8px; font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 8px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; font-size: 13px; }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #238636; }
    button.primary:hover { background: #2ea043; }
    .result { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; display: none; }
    .result.show { display: block; }
    .loading { color: #d29922; font-style: italic; }
    .footer { margin-top: 12px; font-size: 11px; color: #484f58; text-align: center; }
  </style>
</head>
<body>
  <h1>🛡️ Security Companion</h1>
  <div class="mode" id="mode-indicator">Checking model availability...</div>

  <textarea id="input" placeholder="Paste a bug report, vulnerability description, or security text here..."></textarea>

  <div class="actions">
    <button class="primary" data-task="summarizeReport">Summarize</button>
    <button data-task="draftAttackScenario">Attack Scenario</button>
    <button data-task="redactPII">Redact PII</button>
    <button data-task="classifySeverity">Severity</button>
  </div>

  <div class="result" id="result"></div>

  <div class="footer">Hybrid AI: on-device Gemini Nano 4 + cloud fallback via Firebase AI Logic</div>

  <script type="module" src="../src/popup.js"></script>
</body>
</html>
