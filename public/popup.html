<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 380px; background: #0d1117; color: #e6edf3; padding: 16px; font-family: system-ui, sans-serif; }
  h1 { font-size: 17px; color: #58a6ff; margin-bottom: 4px; }
  #mode-badge { font-size: 12px; color: #8b949e; margin-bottom: 12px; display: block; }
  textarea { width: 100%; height: 100px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 8px; font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 8px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; font-size: 13px; }
  button:hover { background: #30363d; }
  #result { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; display: none; }
  #result.show { display: block; }
</style>
</head>
<body>
  <h1>Security Companion</h1>
  <span id="mode-badge">Checking model…</span>

  <textarea id="input" placeholder="Paste a bug report or security text…"></textarea>

  <div class="actions">
    <button data-task="summarize">Summarize</button>
    <button data-task="scenario">Attack Scenario</button>
    <button data-task="redact">Redact</button>
    <button data-task="severity">Severity</button>
  </div>

  <div id="result"></div>

  <script type="module" src="./ui.js"></script>
</body>
</html>
